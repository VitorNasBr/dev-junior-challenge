# docker compose up --build
#
#   web           http://localhost:5173   React app (check-in screen + queue)
#   api           http://localhost:3000   NestJS API
#   mock-service  http://localhost:4000   external patient registry (provided)
#   db            localhost:5432          PostgreSQL

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Lets the api wait until the database really accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d checkin"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      # Inside the compose network the services are reached by their names.
      PATIENT_REGISTRY_URL: http://mock-service:4000
      DATABASE_URL: postgresql://desafio:desafio@db:5432/checkin
      # "Today's queue" is calculated in the hospital's timezone.
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mock-service:
        condition: service_started

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
